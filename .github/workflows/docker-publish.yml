name: Docker publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v3.3.2)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Prove release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-tag: ${{ steps.validate.outputs.release-tag }}
      release-version: ${{ steps.validate.outputs.release-version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      target-sha: ${{ steps.prove.outputs.target-sha }}
      source-run-id: ${{ steps.prove.outputs.source-run-id }}
    steps:
      - id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --input-type=module <<'JS'
        import { appendFileSync } from "node:fs";

        const VERSION_TAG_RE = /^v[0-9]+\.[0-9]+\.[0-9]+$/;
        const tag = String(process.env.RELEASE_TAG ?? "").trim();
        if (!VERSION_TAG_RE.test(tag)) {
          throw new Error("Release tag must match vX.Y.Z");
        }
        const version = tag.slice(1);
        let prerelease = process.env.RELEASE_PRERELEASE === "true";
        if (process.env.EVENT_NAME === "workflow_dispatch") {
          const repo = String(process.env.GITHUB_REPOSITORY ?? "");
          const response = await fetch(
            `${String(process.env.GITHUB_API_URL).replace(/\/$/, "")}/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`,
            {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            },
          );
          if (response.ok) {
            const payload = await response.json();
            prerelease = Boolean(payload?.prerelease);
          }
        }
        const output = process.env.GITHUB_OUTPUT;
        if (!output) throw new Error("GITHUB_OUTPUT is missing");
        appendFileSync(output, `release-tag=${tag}\n`);
        appendFileSync(output, `release-version=${version}\n`);
        appendFileSync(output, `prerelease=${prerelease ? "true" : "false"}\n`);
        JS
      - id: prove
        uses: nocoo/base-ci/.github/actions/release-source@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: .github/workflows/ci.yml
          expected-workflow-name: CI
          expected-branch: main
          tag: ${{ steps.validate.outputs.release-tag }}
          package-version-match: "true"
          require-fresh-main: "false"

  build:
    name: Build and push GHCR image
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.release-tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        env:
          RELEASE_SOURCE_SHA: ${{ needs.source.outputs.target-sha }}
          RELEASE_VERSION: ${{ needs.source.outputs.release-version }}
          RELEASE_PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: node --input-type=module <<'JS'
        import { appendFileSync } from "node:fs";
        const sha = String(process.env.RELEASE_SOURCE_SHA ?? "").trim();
        const version = String(process.env.RELEASE_VERSION ?? "").trim();
        const image = "ghcr.io/nocoo/raven";
        const names = [`${image}:${sha}`];
        if (process.env.RELEASE_PRERELEASE !== "true") {
          names.push(`${image}:v${version}`, `${image}:${version}`);
        }
        const output = process.env.GITHUB_OUTPUT;
        if (!output) throw new Error("GITHUB_OUTPUT is missing");
        appendFileSync(output, `list=${names.join(",")}\n`);
        JS
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BUN_CONFIG_REGISTRY=${{ vars.BUN_CONFIG_REGISTRY }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.target-sha }}
            org.opencontainers.image.version=${{ needs.source.outputs.release-version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=raven
          cache-to: type=gha,mode=max,scope=raven
      - name: Record release image manifest
        env:
          RELEASE_IMAGE: ghcr.io/nocoo/raven
          RELEASE_TAG: ${{ needs.source.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.source.outputs.release-version }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ needs.source.outputs.target-sha }}
          RELEASE_SOURCE_RUN_ID: ${{ needs.source.outputs.source-run-id }}
          RELEASE_PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: node --input-type=module <<'JS'
        import { mkdirSync, writeFileSync } from "node:fs";
        const manifest = {
          image: process.env.RELEASE_IMAGE,
          tag: process.env.RELEASE_TAG,
          version: process.env.RELEASE_VERSION,
          digest: process.env.RELEASE_DIGEST,
          sourceSha: process.env.RELEASE_SOURCE_SHA,
          sourceRunId: process.env.RELEASE_SOURCE_RUN_ID,
          prerelease: process.env.RELEASE_PRERELEASE === "true",
          platform: "linux/amd64",
        };
        mkdirSync("ghcr-release", { recursive: true });
        writeFileSync("ghcr-release/manifest.json", JSON.stringify(manifest, null, 2));
        const summary = [
          "## Raven GHCR image",
          "",
          `- **Digest (content identity):** \`${manifest.digest}\``,
          `- **Source revision:** \`${manifest.sourceSha}\``,
          `- **Release tag:** \`${manifest.tag}\``,
          `- **Version:** \`${manifest.version}\``,
          `- **CI run ID:** \`${manifest.sourceRunId}\``,
          `- **Platform:** \`${manifest.platform}\``,
          "",
          "Reference by digest for production:",
          "",
          `\`ghcr.io/nocoo/raven@${manifest.digest}\``,
          "",
          "Tags also point at this build; prefer digest pinning because tags can move.",
        ].join("\n");
        const summaryPath = process.env.GITHUB_STEP_SUMMARY;
        if (summaryPath) writeFileSync(summaryPath, `${summary}\n`);
        JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: ghcr-manifest-${{ needs.source.outputs.target-sha }}
          path: ghcr-release/manifest.json
          if-no-files-found: error
          retention-days: 90

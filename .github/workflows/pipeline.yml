name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: deploy
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-docker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      deploy-over-ssh: false
      environment: production
      images: '[{"image":"ghcr.io/nocoo/raven","service":"app"}]'
      verify-command: test -n "$IMAGE_DIGEST" && docker buildx imagetools inspect "$IMAGE_REF"

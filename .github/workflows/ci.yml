name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "project"
      test-command: "bun run test:all"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      l2: true
      l2-command: "bun run test:l2"
      coverage-path: "packages/proxy/coverage"

  arch:
    name: "G1 — Architecture (dep-cruiser + fetch-boundary)"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "blocked"
      timeout-minutes: 5
      command: "bun run gate:arch"

  coverage-gate:
    name: "L1 — Coverage gate (§4.5 baseline)"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "blocked"
      timeout-minutes: 10
      command: "bun run scripts/check-coverage.ts"

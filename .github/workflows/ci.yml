name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality-slots.yml

  arch:
    name: Architecture gate (dep-cruiser + fetch-boundary)
    uses: nocoo/base-ci/.github/workflows/test-job.yml@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
    with:
      runtime-version: "1.3.11"
      install-policy: blocked
      timeout-minutes: 5
      command: bun run gate:arch

  docker-context:
    name: Docker build context (.dockerignore keeps build inputs)
    uses: nocoo/base-ci/.github/workflows/test-job.yml@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
    with:
      runtime-version: "1.3.11"
      install-policy: blocked
      timeout-minutes: 5
      command: bun run gate:docker-context
